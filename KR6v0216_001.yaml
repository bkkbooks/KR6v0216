body:
  text: 之一戊戌神龜二年歲次月戊申朔十五日夫蒙文慶為亡父亡妹七世父母因緣眷蜀造立石像一區減割家珍雇良匠仰感帝主覆被之恩追所生顯育之重奇形異容則明工不能加其巧是妻雷男紙釋迦鼓法豈非極之二像主夫蒙文慶母雷紙父名道明靈武妻瓽智祖名曾祖名屈閏平縣令建將軍宜高祖名南地姚高祖名脫紙娥之三聖姿之形容徒禮敬莫不啓悟願使龍華三會恆在初首清信士佛弟子清信士亡光姬光姬願使生天妙朗國土無咎略受佛記若墮三徒速得解退之四妻清信士雷豐供養佛時蒙文慶供養佛時佛弟子息祖慶供養佛合門大小善願從心功廣成就佛弟子息道郎供養佛時清信女照宜供養佛清信女和如供養佛時
